<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4ee;--ink:#1b2326;--mute:#5d686b;--line:#c9d0c6;--accent:#2547e8;--card:#fff}
:root[data-theme=dark]{--bg:#121a1d;--ink:#e8ede6;--mute:#93a0a3;--line:#2b393d;--accent:#7f9bff;--card:#182226}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 "Bricolage Grotesque",system-ui,sans-serif}
a{color:inherit}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 1.25rem}
nav{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0}
nav div{display:flex;gap:1.25rem;align-items:center}nav a{text-decoration:none;color:var(--mute)}nav a:hover{color:var(--ink)}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.3rem .8rem}
h1{font-size:clamp(2.6rem,8vw,5.5rem);line-height:1;letter-spacing:-.04em;font-weight:800;margin:4rem 0 1.25rem;max-width:14ch}
.role{color:var(--accent);font-weight:600;margin:0}
.lede{font-size:1.3rem;max-width:34rem;color:var(--mute)}
.cta{display:inline-block;background:var(--ink);color:var(--bg);padding:.7rem 1.4rem;border-radius:999px;text-decoration:none;font-weight:600;margin-top:1rem}
section{padding:4.5rem 0 0}h2{font-size:1.9rem;letter-spacing:-.02em;margin:0 0 1.5rem}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.proj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.25rem;display:flex;flex-direction:column;gap:.5rem}
.proj h3{margin:0;font-size:1.2rem}.proj p{margin:0;color:var(--mute);flex:1}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;font-size:.85rem;color:var(--accent)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5rem}
.skills h3{margin:0 0 .4rem;font-size:1rem;color:var(--mute);font-weight:600}.skills p{margin:0}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
.tl li{padding:0 0 1.2rem 1.25rem;position:relative}.tl li:before{content:"";position:absolute;left:-6px;top:.55rem;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl b{display:block;font-weight:600;color:var(--mute);font-size:.9rem}
form{display:grid;gap:.8rem;max-width:34rem}
input,textarea{font:inherit;padding:.7rem .9rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
form button{justify-self:start;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:.7rem 1.5rem;font-weight:600}
#status{min-height:1.5rem;color:var(--mute)}
footer{padding:4rem 0 3rem;color:var(--mute);display:flex;gap:1.25rem;flex-wrap:wrap}
#admin{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-top:3rem}
#admin.on{display:block}#admin .row{display:flex;gap:.5rem;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:.5rem 0}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
<nav><strong id="logo"></strong><div><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a>
<button class="ghost" id="theme" aria-label="Toggle dark mode">Theme</button></div></nav>
<header><h1 id="name"></h1><p class="role" id="role"></p><p class="lede" id="tagline"></p><a class="cta" href="#contact">Get in touch</a></header>

<section id="work"><h2>Selected work</h2><div class="filters" id="filters"></div><div class="grid" id="projects"></div></section>
<section id="about"><h2>About</h2><p class="lede" id="about-text" style="margin-top:0"></p>
<div class="skills" id="skills" style="margin:2rem 0"></div><ul class="tl" id="timeline"></ul></section>
<section id="contact"><h2>Contact</h2>
<form id="form"><input name="name" placeholder="Your name" required maxlength="100" aria-label="Your name">
<input name="email" type="email" placeholder="Email address" required aria-label="Email address">
<textarea name="body" rows="5" placeholder="What would you like to talk about?" required minlength="10" aria-label="Message"></textarea>
<button>Send message</button><div id="status" role="status"></div></form></section>

<div id="admin"><h2>Admin</h2>
<form id="login"><input type="password" id="pw" placeholder="Admin password" aria-label="Admin password"><button>Sign in</button></form>
<div id="panel" hidden>
<form id="add"><input name="title" placeholder="Project title" required><input name="summary" placeholder="One-line summary" required>
<input name="tags" placeholder="Tags, comma separated"><input name="link" placeholder="Link"><input name="year" type="number" value="2026"><button>Add project</button></form>
<h3>Projects</h3><div id="plist"></div><h3>Messages</h3><div id="msgs"></div></div></div>
<footer id="links"></footer>
</div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token="", tag="";
const api=async(p,o={})=>{const r=await fetch("/api"+p,{...o,headers:{"Content-Type":"application/json",...(token&&{Authorization:"Bearer "+token})}});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof d.detail==="string"?d.detail:"Something went wrong. Check your input and try again.");return d};
const root=document.documentElement;
root.dataset.theme=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
$("#theme").onclick=()=>{root.dataset.theme=localStorage.theme=root.dataset.theme==="dark"?"light":"dark"};

async function loadProfile(){const p=await api("/profile");document.title=p.name+" · "+p.role;
 $("#logo").textContent=p.name;$("#name").textContent=p.name;$("#role").textContent=p.role;$("#tagline").textContent=p.tagline;$("#about-text").textContent=p.about;
 $("#skills").innerHTML=Object.entries(p.skills).map(([k,v])=>`<div><h3>${esc(k)}</h3><p>${v.map(esc).join(", ")}</p></div>`).join("");
 $("#timeline").innerHTML=p.timeline.map(t=>`<li><b>${esc(t.when)}</b>${esc(t.what)}</li>`).join("");
 $("#links").innerHTML=`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a><a href="${esc(p.github)}">GitHub</a><a href="${esc(p.linkedin)}">LinkedIn</a>`}
async function loadProjects(){const all=await api("/projects");const tags=[...new Set(all.flatMap(p=>p.tags))];
 $("#filters").innerHTML=["All",...tags].map(t=>`<button class="ghost" aria-pressed="${(t==="All"&&!tag)||t===tag}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
 $("#filters").onclick=e=>{const t=e.target.dataset.t;if(t){tag=t==="All"?"":t;loadProjects()}};
 const list=tag?all.filter(p=>p.tags.includes(tag)):all;
 $("#projects").innerHTML=list.map(p=>`<article class="proj"><h3>${esc(p.title)} <small style="color:var(--mute);font-weight:400">${p.year}</small></h3><p>${esc(p.summary)}</p>
 <div class="tags">${p.tags.map(esc).join(" ")}</div><a href="${esc(p.link)}">View project</a></article>`).join("")||"<p>No projects with this tag yet.</p>";
 if(token)$("#plist").innerHTML=all.map(p=>`<div class="row"><span>${esc(p.title)}</span><button class="ghost" data-del="${p.id}">Delete</button></div>`).join("")}
$("#form").onsubmit=async e=>{e.preventDefault();const f=e.target;
 try{await api("/contact",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(f)))});f.reset();$("#status").textContent="Message sent. I'll reply by email."}
 catch(x){$("#status").textContent=x.message}};
// Admin: open /#admin
const showAdmin=()=>$("#admin").classList.toggle("on",location.hash==="#admin");addEventListener("hashchange",showAdmin);showAdmin();
$("#login").onsubmit=async e=>{e.preventDefault();try{token=(await api("/login",{method:"POST",body:JSON.stringify({password:$("#pw").value})})).token;
e.target.hidden=true;$("#panel").hidden=false;loadProjects();loadMsgs()}catch(x){alert(x.message)}};
async function loadMsgs(){const m=await api("/messages");$("#msgs").innerHTML=m.map(x=>`<div class="row"><span><b>${esc(x.name)}</b> (${esc(x.email)}): ${esc(x.body)}</span></div>`).join("")||"<p>No messages yet.</p>"}
$("#add").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.year=+d.year;
 try{await api("/projects",{method:"POST",body:JSON.stringify(d)});e.target.reset();loadProjects()}catch(x){alert(x.message)}};
$("#plist").onclick=async e=>{const id=e.target.dataset.del;if(id){await api("/projects/"+id,{method:"DELETE"});loadProjects()}};
loadProfile();loadProjects();
</script>
</body>
</html>
